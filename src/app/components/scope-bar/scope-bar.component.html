<div class="scope-bar">
  <div class="scope-row">
    <!-- Left: back to all collections -->
    <a routerLink="/collections" class="scope-btn" matTooltip="Browse all collections">
      <mat-icon>grid_view</mat-icon>
      <span>All collections</span>
    </a>

    <span class="spacer"></span>

    <!-- Center: scope selector - shows the active collection, opens a menu to switch -->
    <button type="button" class="scope-selector" [matMenuTriggerFor]="collMenu"
            aria-label="Switch collection" matTooltip="Switch collection">
      <span class="scope-selector-icon"><mat-icon>collections_bookmark</mat-icon></span>
      <span class="scope-selector-text">
        <span class="scope-selector-label">Viewing collection</span>
        <span class="scope-selector-name">
          <!-- invisible sizer: reserves the width of the LONGEST collection name so the pill is a
               stable width and never resizes when switching collections -->
          <span class="sizer" aria-hidden="true">
            @for (c of scope.collections(); track c.id) {
              <span>{{ c.title }}</span>
            }
          </span>
          <span class="active">{{ activeTitle() }}</span>
        </span>
      </span>
      <mat-icon class="scope-selector-caret">expand_more</mat-icon>
    </button>

    <mat-menu #collMenu="matMenu" class="app-menu scope-menu">
      @for (c of scope.collections(); track c.id) {
        <button mat-menu-item (click)="select(c)" [class.is-active]="c.id === activeId()">
          <mat-icon>{{ c.id === activeId() ? 'check_circle' : 'collections_bookmark' }}</mat-icon>
          <span>{{ c.title }}</span>
        </button>
      }
    </mat-menu>

    <span class="spacer"></span>

    <!-- Right: open the collection on the data repository -->
    <a [href]="collectionUrl()" target="_blank" rel="noopener"
       class="scope-btn scope-btn-primary" matTooltip="Open this collection on the data repository">
      <mat-icon>open_in_new</mat-icon>
      <span>View collection</span>
    </a>
  </div>
</div>
