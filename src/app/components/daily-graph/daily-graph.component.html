<div class="filter-container">
  <div>
    <label for="monthInput">Enter Month (e.g., April or 4):</label><br />
    <input 
      type="text" 
      id="monthInput" 
      [(ngModel)]="selectedMonthInput" 
      (keyup.enter)="applyMonthFilter()"
      placeholder="Month name or number"
    />
    <button mat-flat-button color="primary" (click)="applyMonthFilter()">Search</button>
    <button mat-button class="tonal-btn" (click)="resetMonthFilter()">Reset</button>
  </div>
  <div>
    <label for="yearInput">Enter Year (e.g., 2019):</label><br />
    <input 
      type="text" 
      id="yearInput" 
      [(ngModel)]="selectedYearInput" 
      (keyup.enter)="applyYearFilter()"
      placeholder="Year number"
    />
    <button mat-flat-button color="primary" (click)="applyYearFilter()">Search</button>
    <button mat-button class="tonal-btn" (click)="resetYearFilter()">Reset</button>
  </div>
</div>

<div class="chart-container">
  @if (loading()) { <div class="card-spinner"><mat-spinner diameter="40"></mat-spinner></div> }
  @if (errorMsg()) { <p class="status-msg error">{{ errorMsg() }}</p> }
  <canvas #chartCanvas></canvas>
</div>
