<h2 mat-dialog-title>Unique Users per Month</h2>

<mat-dialog-content>
  <div class="filter-container" style="margin-bottom: 0.75rem;">
    <app-month-range [options]="options()" [from]="from()" [to]="to()"
                     (fromChange)="setFrom($event)" (toChange)="setTo($event)" />
    <button mat-button class="tonal-btn" (click)="resetFilter()">Reset</button>
    <app-range-toggle style="margin-left:auto" [value]="activePreset()" (valueChange)="setRange($event)" />
  </div>

  @if (loading()) { <div class="card-spinner"><mat-spinner diameter="40"></mat-spinner></div> }
  @if (errorMsg()) { <p class="status-msg error">{{ errorMsg() }}</p> }
  @if (emptySelection()) {
    <p class="status-msg">No data for the selected range. Try a wider period.</p>
  }

  <div class="chart-container">
    <canvas #chartCanvas></canvas>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button class="tonal-btn" mat-dialog-close>Close</button>
</mat-dialog-actions>
