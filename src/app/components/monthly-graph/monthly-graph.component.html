<!-- Filter controls -->
<div class="filter-container">
  <app-month-range [options]="options()" [from]="from()" [to]="to()"
                   (fromChange)="setFrom($event)" (toChange)="setTo($event)" />
  <button mat-icon-button (click)="resetFilter()" aria-label="Reset period" matTooltip="Reset period">
    <mat-icon>replay</mat-icon>
  </button>
  <app-range-toggle style="margin-left:auto" [value]="activePreset()" (valueChange)="setRange($event)" />
</div>

<!-- Chart -->
<div class="chart-container">
  @if (loading()) { <div class="card-spinner"><mat-spinner diameter="40"></mat-spinner></div> }
  @if (errorMsg()) { <p class="status-msg error">{{ errorMsg() }}</p> }
  @if (emptySelection()) { <p class="status-msg">No data for this selection.</p> }
  <canvas #chartCanvas role="img" aria-label="Bar chart of total download volume in terabytes per month"></canvas>
</div>

<p class="chart-help">
  Total download volume (in terabytes) per month across the repository. Use <strong>Period</strong>
  to focus on a month or year; <strong>Reset</strong> restores all months; the expand icon opens a
  larger view.
</p>
