<mat-toolbar class="flex items-center gap-4">
  <!-- Co-brand lockup: official NIST logo + a divider + this dashboard's name -->
  <a routerLink="/" class="brand" aria-label="Public Data Repository - Data Usage Metrics home">
    <img src="nist-brand-white.svg" alt="National Institute of Standards and Technology"
         class="brand-logo" />
    <span class="brand-divider" aria-hidden="true"></span>
    <span class="brand-sub">
      <span class="brand-sub-title">Public Data Repository</span>
      <span class="brand-sub-desc">Data Usage Metrics</span>
    </span>
  </a>

  <nav class="header-nav hidden md:flex items-center gap-1 ml-2">
    <a mat-button routerLink="/" routerLinkActive="nav-active"
       [routerLinkActiveOptions]="{ exact: true }">All Metrics</a>
    <a mat-button routerLink="/collections" routerLinkActive="nav-active">Collections</a>
  </nav>

  <span class="flex-1"></span>

  @if (metrics.lastUpdated(); as updated) {
    <span class="hidden lg:inline text-xs opacity-80">Updated {{ updated | date: 'shortTime' }} ({{ relativeUpdated() }})</span>
  }
  <a mat-button routerLink="/guide" class="nav-guide-link" aria-label="Open the dashboard guide"
     matTooltip="How to use this dashboard">
    <mat-icon>help_outline</mat-icon>
    <span class="hidden sm:inline">Guide</span>
  </a>
  <button mat-icon-button (click)="metrics.refresh()" aria-label="Refresh data"
          [matTooltip]="metrics.refreshing() ? 'Refreshing…' : 'Refresh data'">
    <mat-icon [class.spin]="metrics.refreshing()">refresh</mat-icon>
  </button>
</mat-toolbar>
