# nginx config for serving the metrics dashboard SPA (standalone image).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the content-hashed build assets.
  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Never cache the app shell or the runtime config, so redeploys and config changes take effect
  # on the next load rather than being pinned by a stale cache.
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /assets/config.json { add_header Cache-Control "no-store"; }

  # SPA fallback: unknown paths return index.html and the Angular router takes over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
